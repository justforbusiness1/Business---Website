    <!-- Navigation -->

            <div class="menu-toggle" id="mobile-menu">

            <ul class="nav-menu">

                <li><a href="about.html" class="nav-link" data-i18n="nav_about">About</a></li>
                <li><a href="products.html" class="nav-link" data-i18n="nav_products">Products</a></li>
                <li><a href="contact.html" class="nav-link" data-i18n="nav_contact">Contact</a></li>

                        <img src="img/usa.png" id="current-lang-flag" alt="Language">

                        <i class="fa-solid fa-caret-down"></i>
                    </div>
                    <div class="lang-dropdown">
                        <div class="lang-option" onclick="changeLanguage('en')"><img src="img/usa.png"> EN</div>
                        <div class="lang-option" onclick="changeLanguage('id')"><img src="img/indonesia.png"> ID</div>
                        <div class="lang-option" onclick="changeLanguage('zh')"><img src="img/china.png"> CN</div>

                </li>

                <div class="line"></div>
            </div>

            <div class="products-grid">
                <!-- Product 1 -->
                <div class="product-card scroll-reveal" data-id="robusta">
                    <div class="card-img">
                        <img src="img/overview 3.jpeg" alt="Robusta">
                    </div>
                    <div class="card-body">
                        <h3 data-i18n="prod_robusta">Premium Robusta</h3>
                        <button class="btn-link view-details" data-i18n="btn_details">View Details</button>
                    </div>
                </div>

                <!-- Product 2 -->
                <div class="product-card scroll-reveal" data-id="arabica">
                    <div class="card-img">
                        <img src="img/overview8.jpeg" alt="Arabica Beans">
                    </div>
                    <div class="card-body">
                        <h3 data-i18n="prod_arabica">Premium Arabica</h3>
                        <button class="btn-link view-details" data-i18n="btn_details">View Details</button>
                    </div>
                </div>

                <!-- Product 3 -->
                <div class="product-card scroll-reveal" data-id="blend">
                    <div class="card-img">
                        <img src="img/overview 2.jpeg" alt="House Blend">
                    </div>
                    <div class="card-body">
                        <h3 data-i18n="prod_blend">Signature Blend</h3>
                        <button class="btn-link view-details" data-i18n="btn_details">View Details</button>
                    </div>
                </div>

                <div class="product-card scroll-reveal" data-id="green">
